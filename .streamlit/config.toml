[theme]
# Theme AlignPro / LI90 - dark professionnel + accent orange
base = "dark"
primaryColor = "#f97316"
backgroundColor = "#0a0a0f"
secondaryBackgroundColor = "#111118"
textColor = "#f4f4f5"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true

[client]
# Cache le menu hamburger et le bouton "View source" qui revele le repo GitHub
toolbarMode = "viewer"
showErrorDetails = false
